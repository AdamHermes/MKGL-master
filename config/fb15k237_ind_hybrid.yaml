output_dir: &output_dir outputs/

model_name: &model_name TinyLlama/TinyLlama-1.1B-Chat-v1.0
kgl_token_length: 10


dataset:
  class: FB15k237Inductive
  path: data/datasets/

tokenizer:
  pretrained_model_name_or_path: *model_name
  use_fast: no
  add_eos_token: no

mkglconfig:
  pretrained_model_name_or_path: *model_name

mkgl:
  pretrained_model_name_or_path: *model_name
  load_in_8bit: no

loraconfig:
  r: &r 32
  lora_alpha: 8
  lora_dropout: 0.05
  target_modules: 
  - q_proj
  - v_proj

trainer:
  output_dir: *output_dir
  num_train_epochs: 2
  save_total_limit: 1
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 16
  evaluation_strategy: epoch
  save_strategy: 'no'
  warmup_ratio: 0.1
  bf16: yes
  logging_steps: 5
  logging_strategy: steps
  learning_rate: 5.0e-3
  lr_scheduler_type: cosine
  gradient_accumulation_steps: 4
  eval_accumulation_steps: 64
  save_safetensors: no
  remove_unused_columns: no
  label_names:
  - label
  optim: adamw_8bit
  max_grad_norm: 0.5
  ddp_find_unused_parameters: yes
  report_to:
  - tensorboard

mkgl4kgc:
  criterion: bce
  num_negative: 32
  strict_negative: yes
  adversarial_temperature: 0.5

context_retriever:
  llm_hidden_dim: &llm_hidden_dim 2048
  r: *r
  text_encoder: pna
  kg_encoder:
    class: PNA
    base_layer:
      class: PNALayer
      input_dim: *r
      output_dim: *r
      query_input_dim: *r
      message_func: distmult
      aggregate_func: sum
      layer_norm: yes
      dependent: yes
    num_layer: 1
    node_ratio: 0.1
    test_node_ratio: 1

score_retriever:
  llm_hidden_dim: *llm_hidden_dim
  r: *r
  text_encoder: pna
  # Enable hybrid retriever
  use_hybrid: yes
  hybrid:
    num_layers: 6
    num_heads: 4
    num_edge_types: 3
    k_semantic: 8
    k_random: 2
    use_pearl: yes
    dropout: 0.15
  kg_encoder:
    class: HybridRetriever
    num_relation: 180  # Will be overwritten by dataset
